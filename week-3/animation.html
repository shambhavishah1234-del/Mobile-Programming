<!DOCTYPE html>
<html>
<head>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


<script>
$(document).ready(function(){

    $("button").click(function(){

        $("div").animate({
            left: "500px"
        }, 1000);

        $("div").queue(function(next){
            $(this).css("background-color", "blue");
            next();
        });

        $("div").animate({
            top: "300px"
        }, 1000);

        $("div").queue(function(next){
            $(this).css("background-color", "green");
            next();
        });

        $("div").animate({
            left: "0px"
        }, 1000);

        $("div").queue(function(next){
            $(this).css("background-color", "yellow");
            next();
        });

        $("div").animate({
            top: "0px"
        }, 1000);

        $("div").queue(function(next){
            $(this).css("background-color", "red");
            next();
        });

    });

});
</script>

</head>

<body>

<button style = "background-color: pink; border: 1px solid black;">Start Animation</button>

<div style="width: 50px; height: 50px; border: 7px dotted black; padding: 20px; margin: 20px; background-color: red; position: absolute;">
</div>

</body>
</html>
