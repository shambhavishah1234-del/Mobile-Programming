<!DOCTYPE html>
<html>

<head>
    <title>jQuery Practice</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="get.css">
</head>

<body>

    <h1>jQuery Practice</h1>

    <div id="profile-card">

        <img id="profile-photo"
             src="profile.png"
             alt="Profile Photo">

        <h2 id="student-name">Student Name</h2>

        <p id="student-bio">
            I am a <b>beginner</b> learning jQuery.
        </p>

        <input type="text"
               id="nickname-input"
               placeholder="Enter nickname">

        <h3>Skills</h3>

        <ul id="skills-list">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>jQuery</li>
        </ul>

    </div>


    <div class="controls">

        <h2>GET & SET</h2>

        <div class="button-group">
            <button id="show-name">Show Name</button>
            <button id="change-name">Change Name</button>
            <button id="show-bio">Show Bio</button>
            <button id="get-input">Get Input</button>
            <button id="set-input">Set Input</button>
        </div>


        <h2>CSS CLASSES</h2>

        <div class="button-group">
            <button id="highlight-card">Highlight Card</button>
            <button id="remove-highlight">Remove Highlight</button>
            <button id="toggle-dark-mode">Toggle Dark Mode</button>
            <button id="toggle-rounded">Toggle Rounded</button>
        </div>


        <h2>CSS METHOD</h2>

        <div class="button-group">
            <button id="red-background">Red Background</button>
            <button id="reset-background">Reset Background</button>
        </div>


        <h2>HIDE & SHOW</h2>

        <div class="button-group">
            <button id="hide-photo">Hide Photo</button>
            <button id="show-photo">Show Photo</button>
            <button id="toggle-bio">Toggle Bio</button>
        </div>


        <h2>FADE</h2>

        <div class="button-group">
            <button id="fade-out-card">Fade Out Card</button>
            <button id="fade-in-card">Fade In Card</button>
            <button id="fade-50">Fade to 50%</button>
        </div>


        <h2>SLIDE</h2>

        <div class="button-group">
            <button id="slide-up-skills">Slide Up Skills</button>
            <button id="slide-down-skills">Slide Down Skills</button>
            <button id="slide-toggle-skills">Slide Toggle Skills</button>
        </div>


        <h2>ANIMATE</h2>

        <div class="button-group">
            <button id="animate-card">Animate Card</button>
        </div>


        <div id="output"></div>

    </div>


    <script>

        $(document).ready(function () {

            // 1. GET & SET

            $("#show-name").click(function () {
                $("#output").text($("#student-name").text());
            });

            $("#change-name").click(function () {
                $("#student-name").text("Shambhawi Shah");
            });

            $("#show-bio").click(function () {
                $("#output").html($("#student-bio").html());
            });

            $("#get-input").click(function () {
                $("#output").text($("#nickname-input").val());
            });

            $("#set-input").click(function () {
                $("#nickname-input").val("jQuery Pro");
            });


            // 2. CSS CLASSES

            $("#highlight-card").click(function () {
                $("#profile-card").addClass("highlighted");
            });

            $("#remove-highlight").click(function () {
                $("#profile-card").removeClass("highlighted");
            });

            $("#toggle-dark-mode").click(function () {
                $("#profile-card").toggleClass("dark-mode");
            });

            $("#toggle-rounded").click(function () {
                $("#profile-photo").toggleClass("rounded");
            });


            // 3. CSS METHOD

            $("#red-background").click(function () {
                $("#profile-card").css("background-color", "red");
            });

            $("#reset-background").click(function () {
                $("#profile-card").css("background-color", "white");
            });


            // 4. HIDE & SHOW

            $("#hide-photo").click(function () {
                $("#profile-photo").hide("slow");
            });

            $("#show-photo").click(function () {
                $("#profile-photo").show("slow");
            });

            $("#toggle-bio").click(function () {
                $("#student-bio").toggle();
            });


            // 5. FADE

            $("#fade-out-card").click(function () {
                $("#profile-card").fadeOut();
            });

            $("#fade-in-card").click(function () {
                $("#profile-card").fadeIn();
            });

            $("#fade-50").click(function () {
                $("#profile-card").fadeTo("slow", 0.5);
            });


            // 6. SLIDE

            $("#slide-up-skills").click(function () {
                $("#skills-list").slideUp();
            });

            $("#slide-down-skills").click(function () {
                $("#skills-list").slideDown();
            });

            $("#slide-toggle-skills").click(function () {
                $("#skills-list").slideToggle();
            });


            // 7. ANIMATE

            $("#animate-card").click(function () {
                $("#profile-card")
                    .animate({ marginLeft: "200px" }, 1000)
                    .animate({ marginLeft: "0px" }, 1000);
            });


            // 8. EVENTS

            $("#profile-photo").mouseenter(function () {
                $("#profile-photo").addClass("shadow");
            });

            $("#profile-photo").mouseleave(function () {
                $("#profile-photo").removeClass("shadow");
            });

            $("#nickname-input").keypress(function (event) {
                $("#output").text(event.key);
            });

        });

    </script>

</body>

</html>
